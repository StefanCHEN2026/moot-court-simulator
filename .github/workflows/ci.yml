name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: 类型检查 / Lint / 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 版本从 package.json 的 packageManager 字段读取；
      # 这里不要再写 version，否则两者冲突会导致该 action 直接失败
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查 + Lint
        run: pnpm validate

      - name: 构建
        run: pnpm build
